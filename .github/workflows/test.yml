name: AI Suite Testing Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  phase1-functional:
    name: "Phase 1: Functional Testing (Gate G1)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Symlink /app to workspace (fix hardcoded paths)
        run: |
          # Application code uses hardcoded /app/... paths (capa, ai_qa, videos, static assets).
          # Symlink /app -> $GITHUB_WORKSPACE so all hardcoded paths resolve to the checkout.
          sudo rm -rf /app 2>/dev/null || true
          sudo ln -s "$GITHUB_WORKSPACE" /app
          ls -la /app | head -5
          echo "Symlink created: /app -> $GITHUB_WORKSPACE"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev libpango1.0-dev libgdk-pixbuf-2.0-dev \
            libffi-dev shared-mime-info poppler-utils ffmpeg \
            libjq-dev pkg-config

      - name: Install backend dependencies
        run: |
          cd backend
          # Fix conflicting dependency pins:
          # scipy==1.17.0 needs numpy>=1.26.4 but python-jobspy==1.1.82 pins numpy==1.26.3
          # Solution: relax numpy pin and install python-jobspy without dep checking
          cp requirements.txt requirements.ci.txt
          sed -i 's/^numpy==.*$/numpy>=1.26.4,<2.7/' requirements.ci.txt
          sed -i '/^python-jobspy==/d' requirements.ci.txt
          
          # Also remove arch-specific packages that may not have x86_64 wheels
          sed -i '/^librt==/d' requirements.ci.txt
          sed -i '/^s5cmd==/d' requirements.ci.txt
          sed -i '/^hf-xet==/d' requirements.ci.txt
          
          pip install -r requirements.ci.txt --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/ || {
            echo "::warning::Full requirements install failed, installing core packages..."
            pip install fastapi==0.110.1 uvicorn==0.25.0 motor==3.3.1 pymongo==4.5.0 \
              bcrypt==4.1.3 python-jose==3.5.0 python-dotenv==1.2.1 pydantic==2.12.5 \
              starlette==0.37.2 python-multipart==0.0.21 httpx==0.28.1 requests==2.32.5 \
              APScheduler==3.11.2 fastapi-cache2==0.2.2 slowapi==0.1.9 aiohttp==3.13.3 \
              PyJWT==2.10.1 passlib==1.7.4 webauthn==2.7.0 stripe==14.1.0 resend==2.21.0 \
              python-socketio==5.16.0 msal==1.35.1 pywebpush==2.2.0 edge-tts==7.2.7 \
              beautifulsoup4==4.14.3 openai==1.99.9 google-genai==1.57.0 litellm==1.80.0 \
              reportlab==4.4.9 pandas pillow lxml qrcode cbor2 cryptography pyotp \
              psutil redis email-validator pyOpenSSL py-vapid xlsxwriter tabulate \
              --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
          }
          
          # Install python-jobspy without dependency checking (works fine at runtime with any numpy)
          pip install --no-deps python-jobspy==1.1.82 || echo "::warning::python-jobspy install failed"
          
          # Ensure emergentintegrations is installed
          pip install emergentintegrations --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/ || echo "::warning::emergentintegrations install failed"
          
          # Install test dependencies
          pip install pytest pytest-html
          
          # Verify critical imports
          python -c "
          import fastapi, motor, pymongo, bcrypt, requests
          print('Core imports OK')
          " || { echo "::error::Critical imports failed"; exit 1; }

      - name: Seed test users
        run: |
          cd backend
          python3 << 'SEED_SCRIPT'
          import pymongo, bcrypt
          client = pymongo.MongoClient('mongodb://localhost:27017')
          db = client['MedMatch']
          hashed = bcrypt.hashpw('Swampdrainer2026!'.encode(), bcrypt.gensalt()).decode()
          db.users.update_one(
            {'email': 'admin@medmatch.com'},
            {'$set': {
              'email': 'admin@medmatch.com',
              'password': hashed,
              'name': 'Admin User',
              'is_admin': True,
              'role': 'admin'
            }},
            upsert=True
          )
          hashed2 = bcrypt.hashpw('TestPassword123!'.encode(), bcrypt.gensalt()).decode()
          db.users.update_one(
            {'email': 'test@medmatch.io'},
            {'$set': {
              'email': 'test@medmatch.io',
              'password': hashed2,
              'name': 'Test User',
              'role': 'recruiter'
            }},
            upsert=True
          )
          print('Admin and test users seeded successfully')
          SEED_SCRIPT
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: MedMatch

      - name: Start backend server
        run: |
          cd backend
          nohup python -m uvicorn server:app --host 0.0.0.0 --port 8001 > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          echo "Waiting for backend to start..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:8001/api/health > /dev/null 2>&1; then
              echo "Backend is ready!"
              curl -s http://localhost:8001/api/health
              break
            fi
            echo "Attempt $i: Server not ready yet..."
            sleep 1
          done
          if ! curl -s http://localhost:8001/api/health > /dev/null 2>&1; then
            echo "::error::Backend failed to start"
            echo "=== Server Logs ==="
            cat /tmp/server.log
            exit 1
          fi
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: MedMatch
          EMERGENT_LLM_KEY: ${{ secrets.EMERGENT_API_KEY }}
          JWT_SECRET_KEY: ci_test_jwt_secret_key_2026

      - name: Run Phase 1 Functional Tests
        run: |
          cd backend
          python -m pytest tests/test_phase1_functional.py \
            -v --tb=long \
            --junitxml=../test_reports/phase1_results.xml \
            -x 2>&1 | tee ../test_reports/phase1_output.txt
        env:
          REACT_APP_BACKEND_URL: http://localhost:8001
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: MedMatch

      - name: Show server logs on failure
        if: failure()
        run: |
          echo "=== Server Logs ==="
          cat /tmp/server.log 2>/dev/null || echo "No server logs found"

      - name: Upload Phase 1 Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-results
          path: test_reports/

