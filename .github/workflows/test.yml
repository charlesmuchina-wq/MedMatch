name: AI Suite Testing Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  phase1-functional:
    name: "Phase 1: Functional Testing (Gate G1)"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
          pip install pytest pytest-html

      - name: Seed test users
        run: |
          cd backend
          python -c "
          import pymongo, bcrypt
          client = pymongo.MongoClient('mongodb://localhost:27017')
          db = client['MedMatch']
          hashed = bcrypt.hashpw('Swampdrainer2026!'.encode(), bcrypt.gensalt()).decode()
          db.users.update_one(
            {'email': 'admin@medmatch.com'},
            {'\$set': {
              'email': 'admin@medmatch.com',
              'password': hashed,
              'name': 'Admin User',
              'is_admin': True,
              'role': 'admin'
            }},
            upsert=True
          )
          hashed2 = bcrypt.hashpw('TestPassword123!'.encode(), bcrypt.gensalt()).decode()
          db.users.update_one(
            {'email': 'test@medmatch.io'},
            {'\$set': {
              'email': 'test@medmatch.io',
              'password': hashed2,
              'name': 'Test User',
              'role': 'recruiter'
            }},
            upsert=True
          )
          print('Admin and test users seeded successfully')
          "
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: MedMatch

      - name: Start backend server
        run: |
          cd backend
          nohup python -m uvicorn server:app --host 0.0.0.0 --port 8001 &
          echo "Waiting for backend to start..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:8001/api/health > /dev/null 2>&1; then
              echo "Backend is ready!"
              break
            fi
            sleep 1
          done
          curl -s http://localhost:8001/api/health || (echo "Backend failed to start" && exit 1)
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: MedMatch
          EMERGENT_API_KEY: ${{ secrets.EMERGENT_API_KEY }}

      - name: Run Phase 1 Functional Tests
        run: |
          cd backend
          python -m pytest tests/test_phase1_functional.py \
            -v --tb=short \
            --html=../test_reports/phase1_report.html \
            --junitxml=../test_reports/phase1_results.xml \
            -x
        env:
          REACT_APP_BACKEND_URL: http://localhost:8001
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: MedMatch

      - name: Upload Phase 1 Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-results
          path: test_reports/

  phase3-regression:
    name: "Phase 3: Post-Reliability Regression (Gate G3)"
    needs: phase1-functional
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
          pip install pytest pytest-html

      - name: Seed test users
        run: |
          cd backend
          python -c "
          import pymongo, bcrypt
          client = pymongo.MongoClient('mongodb://localhost:27017')
          db = client['MedMatch']
          hashed = bcrypt.hashpw('Swampdrainer2026!'.encode(), bcrypt.gensalt()).decode()
          db.users.update_one(
            {'email': 'admin@medmatch.com'},
            {'\$set': {
              'email': 'admin@medmatch.com',
              'password': hashed,
              'name': 'Admin User',
              'is_admin': True,
              'role': 'admin'
            }},
            upsert=True
          )
          hashed2 = bcrypt.hashpw('TestPassword123!'.encode(), bcrypt.gensalt()).decode()
          db.users.update_one(
            {'email': 'test@medmatch.io'},
            {'\$set': {
              'email': 'test@medmatch.io',
              'password': hashed2,
              'name': 'Test User',
              'role': 'recruiter'
            }},
            upsert=True
          )
          print('Admin and test users seeded successfully')
          "
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: MedMatch

      - name: Start backend server
        run: |
          cd backend
          nohup python -m uvicorn server:app --host 0.0.0.0 --port 8001 &
          echo "Waiting for backend to start..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:8001/api/health > /dev/null 2>&1; then
              echo "Backend is ready!"
              break
            fi
            sleep 1
          done
          curl -s http://localhost:8001/api/health || (echo "Backend failed to start" && exit 1)
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: MedMatch
          EMERGENT_API_KEY: ${{ secrets.EMERGENT_API_KEY }}

      - name: Run Phase 3 Regression Tests
        run: |
          cd backend
          python -m pytest tests/test_phase3_regression.py \
            -v --tb=short \
            --html=../test_reports/phase3_report.html \
            --junitxml=../test_reports/phase3_results.xml \
            -x
        env:
          REACT_APP_BACKEND_URL: http://localhost:8001
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: MedMatch

      - name: Upload Phase 3 Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-results
          path: test_reports/

  gate-summary:
    name: "Gate Summary"
    needs: [phase1-functional, phase3-regression]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check Gate Status
        run: |
          echo "=== AI Suite Testing Pipeline Summary ==="
          echo "Phase 1 (Functional - G1): ${{ needs.phase1-functional.result }}"
          echo "Phase 3 (Regression - G3): ${{ needs.phase3-regression.result }}"
          if [ "${{ needs.phase1-functional.result }}" = "success" ] && [ "${{ needs.phase3-regression.result }}" = "success" ]; then
            echo "ALL GATES PASSED - Ready for deployment"
          else
            echo "GATE FAILURE - Fix issues before deploying"
            exit 1
          fi
